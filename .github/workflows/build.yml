name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    # Switched off for now. This job builds the app for Linux to run go vet and
    # all tests (unit, talkback and relay end-to-end); delete the line below to
    # turn it back on. Meanwhile run `go test ./...` locally.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg and GUI build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - run: go vet ./...
      - name: Test (includes the end-to-end SRT relay through real ffmpeg)
        run: go test -race -v ./...

  windows:
    name: Windows amd64
    # Cross-compiled with MinGW: same result as a Windows runner, faster, and
    # reproducible on any Linux box (see README "Build from source").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go build for Windows
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-windows-amd64-${{ hashFiles('go.sum') }}
          restore-keys: go-windows-amd64-
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Fetch ffmpeg to bundle (LGPL build with libsrt)
        # The newest release-branch build from BtbN/FFmpeg-Builds, checked
        # against its published checksums. LGPL (not GPL) keeps the
        # redistribution terms light; it still has SRT, AAC, MP2 and Opus.
        run: |
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          curl -fsSL --retry 3 -o checksums.sha256 "$base/checksums.sha256"
          asset=$(grep -oE 'ffmpeg-n[0-9.]+-latest-win64-lgpl-[0-9.]+\.zip' checksums.sha256 | sort -uV | tail -1)
          [ -n "$asset" ] || { echo "::error::no win64 LGPL release build listed"; exit 1; }
          echo "Bundling $asset"
          curl -fsSL --retry 3 -o ffmpeg.zip "$base/$asset"
          grep " \*\?$asset\$" checksums.sha256 | sed "s| \*\?$asset\$| ffmpeg.zip|" | sha256sum -c -
          exe=$(unzip -Z1 ffmpeg.zip | grep -E '/bin/ffmpeg\.exe$')
          license=$(unzip -Z1 ffmpeg.zip | grep -iE '^[^/]+/LICENSE[^/]*$' | head -1)
          [ -n "$license" ] || { echo "::error::no license file in $asset"; exit 1; }
          unzip -q -j ffmpeg.zip "$exe" "$license" -d ffmpeg-dl
          for feature in libsrt libopus; do
            grep -aq -- "--enable-$feature" ffmpeg-dl/ffmpeg.exe || { echo "::error::bundled ffmpeg lacks $feature"; exit 1; }
          done
          b=internal/bridge/bundled
          mkdir -p "$b"
          gzip -9c ffmpeg-dl/ffmpeg.exe > "$b/ffmpeg.gz"
          sha256sum ffmpeg-dl/ffmpeg.exe | cut -d' ' -f1 > "$b/ffmpeg.sha256"
          cp "ffmpeg-dl/$(basename "$license")" "$b/LICENSE.txt"
          {
            echo "${asset%.zip} (BtbN FFmpeg-Builds, LGPL)"
            echo
            echo "Downloaded $(date -u +%F) from $base/$asset"
            echo "zip sha256: $(sha256sum ffmpeg.zip | cut -d' ' -f1)"
            echo "FFmpeg is licensed under the GNU LGPL 2.1 or later; see LICENSE.txt."
            echo "Source code: https://ffmpeg.org/download.html (the version string names the exact commit)"
            echo "Build scripts: https://github.com/BtbN/FFmpeg-Builds"
          } > "$b/SOURCE.txt"
          ls -la "$b"
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          n=$(echo "$v" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' | tr -d v || true)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=${n:-0.0.0}.0" >> "$GITHUB_OUTPUT"
      - name: Windows resources (icon, manifest, version info)
        working-directory: cmd/srt-audio-bridge
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 \
            --icon ../../internal/gui/icon.png --manifest gui \
            --product-name "SRT Audio Bridge" --file-description "SRT Audio Bridge" \
            --product-version "${{ steps.version.outputs.numeric }}" \
            --file-version "${{ steps.version.outputs.numeric }}" \
            --original-filename srt-audio-bridge.exe
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: |
          # One exe: GUI subsystem (no console window), ffmpeg embedded. With
          # command-line options it attaches to the terminal it was started from.
          go build -trimpath -tags bundleffmpeg \
            -ldflags "-s -w -H=windowsgui -X main.version=${{ steps.version.outputs.version }}" \
            -o dist/srt-audio-bridge.exe ./cmd/srt-audio-bridge
          cp README.md dist/
          cp internal/bridge/bundled/LICENSE.txt dist/ffmpeg-LICENSE.txt
          cp internal/bridge/bundled/SOURCE.txt dist/ffmpeg-SOURCE.txt
          ls -la dist
      - name: Check the exe only needs system DLLs
        run: |
          for f in dist/*.exe; do
            dlls=$(x86_64-w64-mingw32-objdump -p "$f" | awk '/DLL Name/{print $3}')
            echo "$f: $(echo $dlls)"
            if echo "$dlls" | grep -viqE '^(kernel32|user32|gdi32|shell32|opengl32|msvcrt|advapi32|ole32|winmm|ws2_32)\.dll$'; then
              echo "::error file=$f::unexpected DLL dependency"; exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: srt-audio-bridge-windows-amd64
          path: dist/
          if-no-files-found: error

  # macOS comes later. cgo needs Apple's SDK, so it builds on a macOS runner
  # rather than cross-compiling. Roughly:
  #
  # macos:
  #   name: macOS arm64
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version-file: go.mod
  #     # fetch a macOS ffmpeg with libsrt into internal/bridge/bundled/ like
  #     # the Windows job does, then:
  #     - run: go build -trimpath -tags bundleffmpeg -ldflags "-s -w" -o dist/srt-audio-bridge ./cmd/srt-audio-bridge
  #     # then a .app bundle (fyne package -os darwin), signing and notarization
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: srt-audio-bridge-macos-arm64
  #         path: dist/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: srt-audio-bridge-windows-amd64
          path: srt-audio-bridge-windows-amd64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r "srt-audio-bridge-$GITHUB_REF_NAME-windows-amd64.zip" srt-audio-bridge-windows-amd64
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            "srt-audio-bridge-$GITHUB_REF_NAME-windows-amd64.zip"
